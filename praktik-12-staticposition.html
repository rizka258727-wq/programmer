<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Relative Tangga</title>
<style>
.box {
  position: relative;
  width: 100px;
  height: 100px;
  background-color: lightblue;
  margin-bottom: 10px;
}
.step1 { top: 0; left: 0; }
.step2 { top: 20px; left: 40px; background-color: coral; }
.step3 { top: 40px; left: 80px; background-color: lightgreen; }
</style>
</head>
<body>
  <div class="box step1">Step 1</div>
  <div class="box step2">Step 2</div>
  <div class="box step3">Step 3</div>
</body>
</html>
