<!DOCTYPE html>
<html>
<head>
<style>
.box {
  position: relative;
  background-color: lightblue;
  width: 150px;
  height: 150px;
  margin-bottom: 10px;
}

/* Box pertama: geser 50px kanan, 40px bawah */
.box1 {
  left: 50px;
  top: 40px;
}

/* Box kedua: geser lebih jauh */
.box2 {
  left: 100px;
  top: 80px;
  background-color: lightgreen;
}

/* Box ketiga: geser lebih jauh lagi (tangga) */
.box3 {
  left: 150px;
  top: 120px;
  background-color: lightcoral;
}
</style>
</head>
<body>
  <div class="box box1">Box 1</div>
  <div class="box box2">Box 2</div>
  <div class="box box3">Box 3</div>
</body>
</html>
