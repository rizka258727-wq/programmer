<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justify Content Baseline</title>
<style>
.container {
  width: 600px;
  border: 5px solid blue;
  margin: 30px;
  padding: 5px;
  display: flex;
  align-items: baseline; /* baseline berlaku di align-items, bukan justify-content */
}
.container div {
  width: 100px;
  height: 100px;
  background-color: lightseagreen;
  margin: 2px;
}
</style>
</head>
<body>
<div class="container">
  <div class="satu">A</div>
  <div class="dua">BB</div>
  <div class="tiga">CCC</div>
</div>
</body>
</html>
