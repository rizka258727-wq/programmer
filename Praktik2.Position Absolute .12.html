<!DOCTYPE html>
<html>
<head>
<style>
.container {
  position: relative;
  width: 300px;
  height: 300px;
  background-color: lightgray;
}

.box {
  position: absolute;
  width: 80px;
  height: 80px;
  text-align: center;
  line-height: 80px;
  color: white;
  font-weight: bold;
}

/* Kotak di setiap sudut */
.top-left {
  top: 0;
  left: 0;
  background-color: coral;
}

.top-right {
  top: 0;
  right: 0;
  background-color: teal;
}

.bottom-left {
  bottom: 0;
  left: 0;
  background-color: purple;
}

.bottom-right {
  bottom: 0;
  right: 0;
  background-color: green;
}
</style>
</head>
<body>
  <div class="container">
    <div class="box top-left">TL</div>
    <div class="box top-right">TR</div>
    <div class="box bottom-left">BL</div>
    <div class="box bottom-right">BR</div>
  </div>
</body>
</html>
